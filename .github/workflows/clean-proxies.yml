name: Clean and Update Proxies

on:
  schedule:
    - cron: '0 */12 * * *' # Daily at 00:00 and 12:00 (UTC)
  workflow_dispatch: # Manual trigger

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml loguru

      - name: Download Mihomo
        run: |
          # 获取 Mihomo 最新版下载链接，兼容 naming 变化
          API_RESP=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest")
          DOWNLOAD_URL=$(echo "$API_RESP" | grep -o '"browser_download_url": *"[^"]*linux-amd64[^"]*gz"' | head -n 1 | cut -d'"' -f4)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Cannot find mihomo download URL"
            echo "Available assets:"
            echo "$API_RESP" | grep "name" | grep -i mihomo
            exit 1
          fi
          
          echo "Downloading: $DOWNLOAD_URL"
          curl -sL --retry 5 --retry-delay 5 -o mihomo.gz "$DOWNLOAD_URL"
          
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Run Cleaner
        env:
          PROXY_URLS: ${{ secrets.PROXY_URLS }}
          MAX_LATENCY: 1500
        run: python clean_proxies.py
        timeout-minutes: 55

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 使用 token 确保认证
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          git add subscribe.yaml base64.txt
          
          # 检查是否有实际变更
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "更新清洗代理节点 [$(date -u +'%Y-%m-%d %H:%M:%S')]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Prune Git History (Weekly)
        # 每周日 UTC 0 点自动修剪历史提交，保留最近 30 条提交，防止仓库体积膨胀
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Current commit count: $COMMIT_COUNT"
          if [ "$COMMIT_COUNT" -gt 50 ]; then
            echo "Pruning git history to keep repository lightweight..."
            git checkout --orphan temp_branch
            git add -A
            git commit -m "chore: 定期压缩历史提交并保持仓库轻量 [$(date -u +'%Y-%m-%d %H:%M:%S')]"
            git branch -D ${{ github.ref_name }}
            git branch -m ${{ github.ref_name }}
            git push -f origin ${{ github.ref_name }}
            echo "Git history pruned successfully."
          fi
