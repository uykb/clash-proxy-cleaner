name: Clean and Update Proxies

on:
  schedule:
    - cron: '0 */2 * * *' # Daily at 00:00 (London/UTC)
  workflow_dispatch: # Manual trigger

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml loguru

      - name: Download Mihomo
        run: |
          # Get latest release download URL (linux-amd64-compatible)
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64-compatible-v" | head -n 1 | cut -d '"' -f 4)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Failed to get latest mihomo download URL"
            exit 1
          fi
          
          echo "Downloading from: $DOWNLOAD_URL"
          
          # Retry download up to 5 times
          for i in {1..5}; do
            wget -q -O mihomo.gz "$DOWNLOAD_URL" && break || sleep 10;
          done
          
          if [ ! -f mihomo.gz ]; then
            echo "Failed to download mihomo after 5 attempts"
            exit 1
          fi
          
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Run Cleaner
        env:
          PROXY_URLS: ${{ secrets.PROXY_URLS }}
          MAX_LATENCY: 1500
        run: python clean_proxies.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add subscribe.yaml base64.txt
          git commit -m "Update cleaned proxies [$(date -u +'%Y-%m-%d %H:%M:%S')]" || exit 0
          git push
